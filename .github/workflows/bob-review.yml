name: bob-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # Bob posts review comments

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1 – Bob Security Review
  # Bob has READ-ONLY repo scope + dev-plane MCP only.
  # Bob CANNOT reach Key Vault, approval endpoints, or any run-plane MCP.
  # APIM policy rejects BOB_DEV_PLANE_TOKEN for all run-plane operations.
  # ────────────────────────────────────────────────────────────────────────────
  bob-security-review:
    name: IBM Bob — Security Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Bob can diff against base branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Static guardrail checks (deterministic, no LLM needed)
        id: guardrail_check
        run: |
          echo "::group::Guardrail static analysis"

          # G6: no wildcard certs in test fixtures or configs
          if grep -rn "\*\." tests/ src/ --include="*.py" \
             | grep -v "_reject_wildcard\|G6\|Wildcard\|conftest\|test_wildcard\|test_security"; then
            echo "::error::G6 VIOLATION — wildcard cert pattern found outside of wildcard-rejection tests"
            echo "g6_fail=true" >> "$GITHUB_OUTPUT"
          fi

          # G7: no exportable=True in key policies
          if grep -rn "exportable\s*=\s*True" src/ --include="*.py"; then
            echo "::error::G7 VIOLATION — exportable=True found in source"
            echo "g7_fail=true" >> "$GITHUB_OUTPUT"
          fi

          # G8: no hard-coded secrets (basic patterns)
          if grep -rEn \
            "(password|secret|api_key|apikey|client_secret)\s*=\s*['\"][^'\"]{8,}" \
            src/ --include="*.py" | grep -v "test_\|#"; then
            echo "::error::G8 VIOLATION — potential hard-coded secret found"
            echo "g8_fail=true" >> "$GITHUB_OUTPUT"
          fi

          # G1: approval_tool must contain the HITL guard
          if ! grep -q "request_approval\|HITL\|approval_timeout" src/tools/approval_tool.py; then
            echo "::error::G1 VIOLATION — approval_tool.py appears to be missing HITL guard"
            echo "g1_fail=true" >> "$GITHUB_OUTPUT"
          fi

          echo "::endgroup::"

      - name: Run unit + security test suite
        run: |
          pytest tests/ \
            --ignore=tests/test_e2e \
            --tb=short \
            -q
        env:
          FOUNDRY_PROJECT_ENDPOINT: https://placeholder.api.azureml.ms
          KEY_VAULT_URI: https://placeholder.vault.azure.net
          COSMOS_ENDPOINT: https://placeholder.documents.azure.com:443/
          BLOB_ACCOUNT_URL: https://placeholder.blob.core.windows.net

      - name: Dependency vulnerability scan
        run: pip-audit --strict

      - name: Post guardrail summary as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            // Remove previous Bob review comments
            for (const comment of comments) {
              if (comment.body.startsWith('<!-- bob-review -->')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }
            const outcome = '${{ job.status }}' === 'success' ? '✅ PASS' : '❌ FAIL';
            const body = `<!-- bob-review -->
            ## IBM Bob Security Review — ${outcome}
            **PR:** #${context.issue.number} | **Commit:** ${context.sha.slice(0,7)}

            | Check | Result |
            |-------|--------|
            | G1 — HITL gate present | ${{ steps.guardrail_check.outputs.g1_fail == 'true' && '❌' || '✅' }} |
            | G6 — No wildcard certs | ${{ steps.guardrail_check.outputs.g6_fail == 'true' && '❌' || '✅' }} |
            | G7 — Non-exportable keys | ${{ steps.guardrail_check.outputs.g7_fail == 'true' && '❌' || '✅' }} |
            | G8 — No hard-coded secrets | ${{ steps.guardrail_check.outputs.g8_fail == 'true' && '❌' || '✅' }} |
            | Unit + security tests | ${{ job.status == 'success' && '✅' || '❌' }} |
            | Dependency audit | ${{ job.status == 'success' && '✅' || '❌' }} |

            > **Bob's token scope:** read-only repo + dev-plane MCP only.
            > Bob cannot reach Key Vault, approval, graph_mail, or ServiceNow (APIM rejects at runtime).
            `;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if any guardrail violated
        if: |
          steps.guardrail_check.outputs.g1_fail == 'true' ||
          steps.guardrail_check.outputs.g6_fail == 'true' ||
          steps.guardrail_check.outputs.g7_fail == 'true' ||
          steps.guardrail_check.outputs.g8_fail == 'true'
        run: |
          echo "One or more guardrails violated. Merge blocked."
          exit 1

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2 – Bob Acceptance-Criteria Validation
  # Runs only after security review passes.
  # ────────────────────────────────────────────────────────────────────────────
  bob-validation:
    name: IBM Bob — Acceptance Criteria Validation
    runs-on: ubuntu-latest
    needs: bob-security-review
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Coverage gate (≥ 80%)
        run: |
          pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --ignore=tests/test_e2e \
            -q
        env:
          FOUNDRY_PROJECT_ENDPOINT: https://placeholder.api.azureml.ms
          KEY_VAULT_URI: https://placeholder.vault.azure.net
          COSMOS_ENDPOINT: https://placeholder.documents.azure.com:443/
          BLOB_ACCOUNT_URL: https://placeholder.blob.core.windows.net

      - name: Validate task acceptance criteria (T01–T20 checklist)
        run: |
          python -c "
          import subprocess, sys
          # Structural AC checks — each maps to a T-number requirement
          checks = {
            'T01 settings': ('grep', ['-r', 'Settings', 'src/config.py']),
            'T02 state machine': ('grep', ['-r', 'class State', 'src/orchestrator/state_machine.py']),
            'T03 policy middleware': ('grep', ['-r', 'PolicyMiddleware', 'src/middleware/policy_middleware.py']),
            'T04 audit middleware': ('grep', ['-r', 'AuditMiddleware', 'src/middleware/audit_middleware.py']),
            'T05 generate_csr': ('grep', ['-r', 'def generate_csr', 'src/tools/generate_csr.py']),
            'T06 verify_cer': ('grep', ['-r', 'def verify_cer', 'src/tools/verify_cer.py']),
            'T07 approval tool': ('grep', ['-r', 'def request_approval', 'src/tools/approval_tool.py']),
            'T11 cosmos_repo': ('grep', ['-r', 'class CosmosRepo', 'src/persistence/cosmos_repo.py']),
            'T11 blob_repo': ('grep', ['-r', 'class BlobRepo', 'src/persistence/blob_repo.py']),
          }
          failed = []
          for label, (cmd, args) in checks.items():
            r = subprocess.run([cmd] + args, capture_output=True)
            if r.returncode != 0:
              print(f'FAIL: {label}')
              failed.append(label)
            else:
              print(f'PASS: {label}')
          if failed:
            sys.exit(1)
          "

      - name: Post validation summary as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const outcome = '${{ job.status }}' === 'success' ? '✅ PASS' : '❌ FAIL';
            const body = `<!-- bob-validation -->
            ## IBM Bob Acceptance Criteria Validation — ${outcome}
            **PR:** #${context.issue.number} | **Commit:** ${context.sha.slice(0,7)}

            All T01–T20 structural checks ran. Coverage gate: ≥ 80%.
            See job logs for per-task details.
            `;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

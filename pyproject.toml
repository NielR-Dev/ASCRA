[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssl-renewal-agent"
version = "1.0.0"
description = "Autonomous SSL Certificate Renewal Agent — run plane implementation"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
authors = [
    { name = "IBM Bob (dev plane)", email = "bob@ibm.example.com" }
]
keywords = ["ssl", "certificate", "renewal", "agent", "azure", "maf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    # Microsoft Agent Framework 1.0 — GA April 2026; pin to 1.0.x; SK fallback within 1-yr window
    "agent-framework==1.0.*",

    # Azure Identity — Managed Identity + DefaultAzureCredential
    "azure-identity>=1.16.0,<2.0.0",

    # Azure Key Vault — Managed HSM, certificate/key operations (G7: non-exportable)
    "azure-keyvault-certificates>=4.8.0,<5.0.0",
    "azure-keyvault-keys>=4.9.0,<5.0.0",

    # Azure Cosmos DB — workflow_state, audit_log, idempotency, batch containers
    "azure-cosmos>=4.7.0,<5.0.0",

    # Azure Blob Storage — CER WORM / legal hold (7-year retention)
    "azure-storage-blob>=12.21.0,<13.0.0",

    # Azure Service Bus — alert queue consumer
    "azure-servicebus>=7.12.0,<8.0.0",

    # Azure Functions — isolated process model (Python 3.11)
    "azure-functions>=1.20.0,<2.0.0",

    # Cryptography — deterministic CER verifier: X.509 parsing, chain validation (G2)
    # NOTE: this library is pure code; the LLM does NOT call it. verify_cer is a deterministic tool.
    "cryptography>=43.0.0,<44.0.0",

    # Pydantic v2 — typed request/response models, config validation
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",

    # OpenTelemetry — distributed tracing per workflow_id (P12)
    "opentelemetry-api>=1.25.0,<2.0.0",
    "opentelemetry-sdk>=1.25.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.25.0,<2.0.0",
    "opentelemetry-instrumentation-azure-sdk>=0.1.0",

    # Azure Monitor OpenTelemetry exporter — App Insights
    "azure-monitor-opentelemetry-exporter>=1.0.0b21,<2.0.0",

    # HMAC utilities for Slack request-signature verification (G8: no secrets in code)
    "hmac; python_version>='3.11'",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",

    # HTTP mocking (for MCP/Graph/Jira/SNOW call stubs)
    "respx>=0.21.0,<1.0.0",
    "responses>=0.25.0,<1.0.0",

    # AWS/Azure SDK mocking
    "moto[s3]>=5.0.0,<6.0.0",

    # Code quality
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "black>=24.0.0,<25.0.0",

    # Security scanning — runs in CI on every build
    "pip-audit>=2.7.0,<3.0.0",

    # Type stubs
    "azure-identity-stubs",
    "types-cryptography",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations
    "SIM",  # flake8-simplify
]
ignore = [
    "ANN101",  # Missing type annotation for `self`
    "ANN102",  # Missing type annotation for `cls`
    "S101",    # Use of assert detected — acceptable in tests
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "ANN", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
# MAF 1.0 stubs may not be available; allow missing for the framework package only
[[tool.mypy.overrides]]
module = "agent_framework.*"
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
    "-v",
]
markers = [
    "e2e: End-to-end tests that require a running ASCRA Function App (FUNC_HOST env var)",
    "performance: Performance/SLO tests (excluded from standard CI run)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:azure",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/functions/*/host.json",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
